schema: 1
maintainer: Juan Pavon <pavon.gnu@gmail.com>

arches: [amd64, arm64]

suites:            # orden = orden del informe
  bookworm: {image: "debian:bookworm", level2_suffix: deb12}
  trixie:   {image: "debian:trixie",   level2_suffix: deb13}
  sid:      {image: "debian:sid",      level2_suffix: debsid}
  noble:    {image: "ubuntu:noble",    level2_suffix: u2404}
  resolute: {image: "ubuntu:resolute", level2_suffix: u2604}

lintian:
  image: "debian:trixie"
  fail_on: error
  never_override_patterns:  # regex; constitución VII: seguridad, licencia y copyright
    - "^copyright-"
    - "^license-problem-"
    - "^dep5-"
    - "^missing-license"
    - "^no-copyright-file$"
    - "^embedded-library$"
    - "^setuid-binary$"
    - "^setgid-binary$"
    - "^non-standard-executable-perm$"

elf_dependencies:          # NEEDED -> paquete; {glibc} se reemplaza por la GLIBC_x.y máxima
  libc.so.6:       "libc6 (>= {glibc})"
  libm.so.6:       "libc6 (>= {glibc})"
  libdl.so.2:      "libc6 (>= {glibc})"
  librt.so.1:      "libc6 (>= {glibc})"
  libpthread.so.0: "libc6 (>= {glibc})"
  libgcc_s.so.1:   "libgcc-s1"
  ld-linux-x86-64.so.2:  "libc6 (>= {glibc})"   # el cargador, si un binario lo declara en NEEDED
  ld-linux-aarch64.so.1: "libc6 (>= {glibc})"   # (bob arm64 lo hace)

community_repos:           # constitución V; comprobación manual en la fase 1
  - name: griffo
    url: https://debian.griffo.io

completions_image: "debian:trixie"

repo:                      # publicación (specs/002-signed-apt-repo/contracts/config.md)
  url: "https://apt.opentepache.org"   # research D11
  origin: debfactory
  label: debfactory
  component: main
  keep: 3                  # versiones por paquete y suite (FR-013); mínimo 1
  signing:
    masters: [72671CD221684BF7FDCDFB3965B278975D4FE04B]            # fingerprints (40 hex) de las llaves maestras publicadas en el keyring
    subkey: 84983CE038A7C73647AF0C9A15DDD1383F3A75D5             # fingerprint de la subllave que firma
    warn_days: 60          # FR-023
  destinations:
    local:
      remote: /var/tmp/debfactory-repo   # directorio que sirve `just serve`
      cache_control: false
    r2:
      remote: "r2:debfactory-apt"         # remote de rclone; credenciales fuera del repo
      public_url: "https://apt.opentepache.org"   # normalmente igual a repo.url
      cache_control: true
    r2test:                               # bucket de prueba (T048, `just e2e-r2`)
      remote: "r2:debfactory-apt-test"
      public_url: "https://apt-test.opentepache.org"
      cache_control: true
  cache_control:
    immutable: "public, max-age=31536000, immutable"   # pool/ y by-hash/
    mutable: "public, max-age=60"                      # InRelease, Release*, Packages*, keyring
