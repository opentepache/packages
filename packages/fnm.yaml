schema: 1
name: fnm
version: 1.39.0
pav: 1
level: 1
summary: fast and simple Node.js version manager
description: |
  fnm (Fast Node Manager) installs Node.js versions and switches between
  them per directory. Single static binary written in Rust.
homepage: https://github.com/Schniz/fnm
upstream: Schniz/fnm
license:
  spdx: GPL-3.0-only
  file: {repo: LICENSE}
value: Not in Debian or Ubuntu; author has no APT repository; not in griffo.
arch_map: {amd64: linux, arm64: arm64}
artifact:
  url: https://github.com/Schniz/fnm/releases/download/{{tag}}/fnm-{{arch}}.zip
  format: zip
install:
  - {src: fnm, dst: /usr/bin/}
completions:
  bash: {generate: fnm completions --shell bash}
  zsh: {generate: fnm completions --shell zsh}
  fish: {generate: fnm completions --shell fish}
lintian_overrides:
  - {tag: statically-linked-binary, path: /usr/bin/fnm, reason: Upstream arm64 build is fully static by design; level 1 repackaging cannot relink it.}
  - {tag: unstripped-binary-or-object, path: /usr/bin/fnm, reason: Upstream arm64 binary ships with symbols; stripping would alter the official binary.}
