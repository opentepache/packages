# Plantilla del workflow de pull requests de `packages` (specs/009,
# contracts/pipeline.md). La copia el mantenedor a
# packages/.github/workflows/pr.yml (T034).
#
# Corre entera en runners estándar gratuitos de GitHub: sin secretos, sin
# escritura del repositorio y sin runners propios (la PC no ejecuta código de
# un PR). Cada artefacto se atesta igual que en main. El job verify resume el
# resultado: el ruleset de main lo exige.
name: pr

on:
  pull_request:
    paths-ignore:
      - 'repo/state.yaml'
      - 'repo/audit.jsonl'

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      compare: ${{ steps.matrix.outputs.compare }}
      l1_build: ${{ steps.matrix.outputs.l1_build }}
      l2_source: ${{ steps.matrix.outputs.l2_source }}
      l2_build: ${{ steps.matrix.outputs.l2_build }}
      test: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &tool-checkout
        name: herramienta (debfactory.version)
        run: echo "TOOL_SHA=$(cat debfactory.version)" >> "$GITHUB_ENV"
      - &tool-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentepache/debfactory
          ref: ${{ env.TOOL_SHA }}
          path: .tool
          persist-credentials: false
      - &tool-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.26.4
          cache: false
      - &tool-build
        name: compilar debfactory
        run: |
          test "$(git -C .tool rev-parse HEAD)" = "$TOOL_SHA"
          go build -C .tool -trimpath -ldflags "-X debfactory/internal/version.Commit=$TOOL_SHA" \
            -o "$RUNNER_TEMP/bin/debfactory" ./cmd/debfactory
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # La base es el commit fijo del evento, no origin/main.
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: debfactory ci matrix --mode pr --base "$BASE_SHA" >> "$GITHUB_OUTPUT"

  l1-build:
    needs: plan
    if: needs.plan.outputs.l1_build != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.l1_build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *tool-checkout
      - *tool-source
      - *tool-go
      - *tool-build
      - name: build
        env:
          GITHUB_TOKEN: ${{ github.token }} # solo lectura: API de atestaciones de upstream
          PKG: ${{ matrix.package }}
          ARCH: ${{ matrix.arch }}
        run: debfactory build "$PKG" --arch "$ARCH" --out "out/l1-$PKG-$ARCH"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/**/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l1-${{ matrix.package }}-${{ matrix.arch }}
          path: out/l1-${{ matrix.package }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  l2-source:
    needs: plan
    if: needs.plan.outputs.l2_source != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.l2_source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *tool-checkout
      - *tool-source
      - *tool-go
      - *tool-build
      - name: level2 source
        env:
          GITHUB_TOKEN: ${{ github.token }} # solo lectura: API de GitHub
          PKG: ${{ matrix.package }}
        run: debfactory level2 source "$PKG" --out "out/source-$PKG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/**/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ matrix.package }}
          path: out/source-${{ matrix.package }}
          retention-days: 1
          if-no-files-found: error

  l2-build:
    needs: [plan, l2-source]
    if: needs.plan.outputs.l2_build != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.l2_build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *tool-checkout
      - *tool-source
      - *tool-go
      - *tool-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-${{ matrix.package }}
          path: src
      - name: level2 build
        env:
          PKG: ${{ matrix.package }}
          SUITE: ${{ matrix.suite }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: >-
          debfactory level2 build "$PKG" --suite "$SUITE" --arch "$ARCH" --variant "$VARIANT"
          --source "src/$SUITE" --out "out/build-$PKG-$SUITE-$ARCH-$VARIANT" --disk
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/**/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.package }}-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: out/build-${{ matrix.package }}-${{ matrix.suite }}-${{ matrix.arch }}-${{ matrix.variant }}
          retention-days: 1
          if-no-files-found: error

  test:
    needs: [plan, l1-build, l2-build]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.test != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *tool-checkout
      - *tool-source
      - *tool-go
      - *tool-build
      # El .deb a probar: el de nivel 1 de la arquitectura o la variante 0 de
      # la suite y arquitectura (accept comprueba que las dos son iguales).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: l1-${{ matrix.package }}-${{ matrix.arch }}
          path: in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-${{ matrix.package }}-${{ matrix.suite }}-${{ matrix.arch }}-0
          path: in
      - name: test
        env:
          PKG: ${{ matrix.package }}
          SUITE: ${{ matrix.suite }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -- in/*/*.deb
          test "$#" -eq 1
          debfactory test "$PKG" --suite "$SUITE" --arch "$ARCH" --deb "$1" --out "out/test-$PKG-$SUITE-$ARCH"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/**/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-${{ matrix.package }}-${{ matrix.suite }}-${{ matrix.arch }}
          path: out/test-${{ matrix.package }}-${{ matrix.suite }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  # Paquetes ya publicados que el PR reconstruye (cambio de herramienta, o de
  # manifiesto o lockfile sin subir revision): MUST dar el sha256 publicado.
  compare:
    needs: [plan, l1-build, l2-build]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.compare != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *tool-checkout
      - *tool-source
      - *tool-go
      - *tool-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: ci compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: debfactory ci compare --base "$BASE_SHA" --artifacts "$RUNNER_TEMP/artifacts"

  # Señales de aviso (FR-017, FR-018): resumen del cambio con GitHub Models y
  # Scorecard. Sin secretos ni escritura; no bloquea.
  review:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *tool-checkout
      - *tool-source
      - *tool-go
      - *tool-build
      - name: ci review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: debfactory ci review --base "$BASE_SHA" > review.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review
          path: review.md
          retention-days: 1

  # Publica el comentario; no usa IA ni ejecuta código del PR.
  comment:
    needs: review
    if: ${{ !cancelled() && needs.review.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review
      - name: comentar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -s review.md ]; then gh pr comment "$PR" --body-file review.md; fi

  verify:
    needs: [plan, l1-build, l2-source, l2-build, test, compare]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: resultado
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'
