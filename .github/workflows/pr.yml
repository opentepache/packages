# Check de los pull requests (specs/003-ci-pipeline, contracts/workflows.md).
# `debfactory` es el lanzador de la imagen del runner: ejecuta la versión que
# fija debfactory.version (specs/004-split-repos, contracts/herramienta.md).
# Corre en el runner no confiable (dfci): sin secretos, sin <data>, sin red
# local. Nunca firma, publica ni escribe en el repositorio (FR-009, FR-017).
# Los PR de forks esperan la aprobación del mantenedor en cada push (FR-013).
name: pr

# Sin paths-ignore: el ruleset de main exige el check verify y un workflow que
# no corre lo deja pendiente para siempre. `ci pr` decide en segundos que un
# cambio de solo documentación no construye nada (FR-011).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, debfactory-pr]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # La base es el commit fijo del evento, no origin/main: si main avanza
      # antes de que corra el check, el diff saldría vacío y pasaría sin probar.
      - name: debfactory ci pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: debfactory ci pr --base "$BASE_SHA"
