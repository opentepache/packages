# Spike T003 de la fase 005 (specs/005-upstream-release-watch en
# opentepache/debfactory, plan riesgo 1). TEMPORAL: se borra con otro PR.
# Con el token de la App comprueba:
#   (a) verify corre en su PR sin "Approve workflows to run";
#   (b) el auto-merge lo integra solo tras verify;
#   (c) ese merge dispara main.yml (termina en "nada que publicar");
#   (f) el token lee releases de un repositorio ajeno, y con qué límite.
# El cambio es un archivo nuevo e inocuo (.github/spike-005.txt): no es una ruta
# de código (el check termina en segundos) y main.yml no lo ignora.
name: spike-app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: [self-hosted, debfactory-pr]
    environment: watch
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEBFACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEBFACTORY_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: rama, PR y auto-merge con el token de la App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git switch -q -c debfactory/update/spike
          echo "spike T003 de la fase 005; se borra con otro PR" > .github/spike-005.txt
          git add .github/spike-005.txt
          git -c user.name="$SLUG[bot]" -c user.email="$SLUG[bot]@users.noreply.github.com" \
            commit -q -m "spike: PR de la App (T003 de la fase 005)"
          git push -q origin HEAD:refs/heads/debfactory/update/spike
          api() { curl -fsS -A debfactory -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$@"; }
          pr=$(api -X POST "https://api.github.com/repos/$REPO/pulls" -d '{"head":"debfactory/update/spike","base":"main",
            "title":"spike: PR de la App (T003 de la fase 005)",
            "body":"Spike de la fase 005: verify sin aprobación, auto-merge de la App y main.yml tras el merge. No integrar a mano."}')
          num=$(printf '%s' "$pr" | jq -r .number)
          node=$(printf '%s' "$pr" | jq -r .node_id)
          jq -n --arg id "$node" '{query: "mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { clientMutationId } }", variables: {id: $id}}' |
            api -X POST https://api.github.com/graphql -d @- | tee /dev/stderr | jq -e '.errors == null' >/dev/null
          echo "PR #$num abierto por $SLUG[bot] con auto-merge"
      - name: (f) lectura de un upstream ajeno con el token de la App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          curl -sS -o /dev/null -D - -A debfactory -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/MordechaiHadad/bob/releases?per_page=1' | grep -iE '^(HTTP|x-ratelimit-limit)'
